# Настройки плановых проверок: читают jarvis-plan-backoff и jarvis-check-tick.
# Строки KEY=VALUE. Переменные окружения сильнее этого файла.
# Существующий файл установщик не перезаписывает.

# Интервалы, минуты: база (и сброс при новостях), потолок при тишине
JARVIS_PLAN_BASE_MIN=10
JARVIS_PLAN_CAP_MIN=1440

# Инструкция плановой проверки (по умолчанию шаблон из эталона)
#JARVIS_PLAN_INSTRUCTION=/home/claude/github/infra/templates/plan-check.md
# Текст промта; {instruction} подставляется путём инструкции
#JARVIS_PLAN_PROMPT=Плановая проверка. Выполни инструкцию из {instruction}.

# Сторож: имя tmux-сессии агента, порог зависания (мин), папка тревог владельцу
#JARVIS_TMUX=claude
#JARVIS_STALL_MIN=20
#JARVIS_ALERT_DIR=/home/exchange/for-owner
