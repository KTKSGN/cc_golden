# Ждать синхронизации часов: на AHV часы ВМ при загрузке могут быть сдвинуты на пояс кластера,
# а сессия, поднятая на неверном времени, сбивает расписание планировщика.
[Unit]
After=time-sync.target
Wants=time-sync.target
[Service]
ExecStartPre=-/usr/bin/timeout 120 /bin/sh -c 'until [ "$$(timedatectl show -p NTPSynchronized --value)" = yes ]; do sleep 2; done'
